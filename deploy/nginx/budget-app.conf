# Production nginx configuration for BustBudget
# Install to: /etc/nginx/sites-available/budget-app
#
# The container serves both the API and the built client on 127.0.0.1:3001,
# so nginx no longer needs a document root: it terminates TLS and proxies
# everything. Asset caching headers come from Express (immutable for hashed
# assets, no-cache for index.html).

upstream backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name budget.bustbyte.no;

    include /etc/nginx/snippets/letsencrypt.conf;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name budget.bustbyte.no;

    # SSL certificates (use certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/budget.bustbyte.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.bustbyte.no/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Excel/CSV imports are posted to the API
    client_max_body_size 20m;

    # Gzip compression. `gzip_proxied any` is required now that the responses
    # come from an upstream rather than from disk.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # API
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer responses
        proxy_buffering off;
    }

    # Client bundle and SPA fallback, both served by Express inside the
    # container. Buffering stays on here so nginx can stream static files
    # to slow clients without holding an upstream connection open.
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
